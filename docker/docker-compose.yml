# Nur MariaDB fuer die Backend-Entwicklung. Gesamtsystem (FE+BE+DB+S3): Repo refcard-05-fullstack-aws/docker-compose-local
services:
  bbw-mariadb-trips-dev:
    image: mariadb
    container_name: bbw-mariadb-trips-dev
    environment:
      # Passwort kommt aus der Shell-Umgebung, nicht aus dem Repo: export DB_PASSWORD=...
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD:?DB_PASSWORD setzen}
      - MARIADB_DATABASE=db_biztrips
    ports:
      - "3306:3306"
    volumes:
      - ./database:/var/lib/mysql

  bbw-phpmyadmin-trips:
    depends_on:
      - bbw-mariadb-trips-dev
    image: phpmyadmin/phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: bbw-mariadb-trips-dev
