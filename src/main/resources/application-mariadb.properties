# Profil "mariadb": Aktivieren mit SPRING_PROFILES_ACTIVE=mariadb
# Alle Verbindungsdaten kommen aus Umgebungsvariablen - KEINE Zugangsdaten im Code:
#   lokal:  docker-compose-local/.env  (siehe Compose-Repo)
#   AWS:    ECS-Task-Definition (DB_HOST/DB_PORT/DB_NAME/DB_USER als environment,
#           DB_PASSWORD als "secrets" aus AWS Secrets Manager)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_biztrips}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
