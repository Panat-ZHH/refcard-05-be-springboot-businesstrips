spring.application.name=biztrips-backend

# --- Actuator: Health (fuer ALB/ECS-Health-Checks) + Info (deployte Version) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# readiness = App bereit + DB erreichbar -> wird vom ALB und vom Container-Health-Check verwendet
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.git-sha=${GIT_SHA:local}

# --- CORS: erlaubte Frontend-Origins (kommagetrennt), auf AWS ueber CORS_ALLOWED_ORIGINS gesetzt ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

# --- Bilder-Storage: Default lokal (Dateisystem/Volume), Profil "s3" schaltet auf Amazon S3 um ---
storage.type=local
storage.local.dir=${STORAGE_LOCAL_DIR:./data/images}
storage.seed.enabled=${STORAGE_SEED_ENABLED:true}
storage.max-file-size=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Graceful Shutdown: ECS stoppt alte Tasks beim Rolling Deployment sauber (SIGTERM)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
