# Profil "s3": Bilder-Storage auf Amazon S3 (oder S3-kompatibel, z. B. MinIO lokal)
# Credentials: AWS SDK DefaultCredentialsProvider -> auf ECS die Task-Rolle, lokal Env-Variablen.
storage.type=s3
storage.s3.bucket=${S3_BUCKET}
storage.s3.region=${AWS_REGION:us-east-1}
# nur lokal mit MinIO gesetzt (z. B. http://minio:9000), auf AWS leer
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.path-style=${S3_PATH_STYLE:false}
