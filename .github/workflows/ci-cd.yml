# Backend CI/CD (RefCard05)
#   build & test  ->  Docker-Image nach Amazon ECR  ->  Rolling Deployment auf ECS (Fargate)  ->  Smoke-Test
#
# Trigger:
#   - Pull Request auf main: nur build & test
#   - Push auf main:          build, test, Image (sha-<commit>, main) + Deploy
#   - Git-Tag vX.Y.Z:         build, test, Image (X.Y.Z, X.Y, latest, sha-<commit>) + Deploy dieser Version
#
# AWS-Zugang (AWS Academy Learner Lab, kein OIDC moeglich):
#   secrets.AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN  -> laufen mit der Lab-Session ab!
# Nicht-geheime Konfiguration als Repository-Variables (Settings -> Secrets and variables -> Variables):
#   vars.DB_SECRET_ARN, vars.S3_BUCKET, vars.APP_URL
name: Backend CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: biztrips-backend
  ECS_CLUSTER: biztrips-cluster
  ECS_SERVICE: biztrips-backend-service
  CONTAINER_NAME: biztrips-backend

jobs:
  build-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # alle Tags, fuer git describe

      - name: Version aus Git-Tag bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # z. B. 1.0.0-3-gabc1234 = 3 Commits nach v1.0.0
            VERSION="$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null | sed 's/^v//')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Backend-Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: ./mvnw -B verify -Drevision=${{ steps.version.outputs.version }}

      - name: Testergebnisse in die Job-Summary schreiben
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests')); f += int(r.get('failures')); e += int(r.get('errors')); s += int(r.get('skipped'))
          print(f"| Tests | Fehlgeschlagen | Fehler | Uebersprungen |\n|---|---|---|---|\n| {t} | {f} | {e} | {s} |")
          PY

      - name: Testreports hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  image:
    name: Docker-Image -> Amazon ECR
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Learner-Lab-Secrets vorhanden?
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TOKEN" ]; then
            echo "::error title=AWS-Secrets fehlen::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN aus dem Learner Lab (AWS Details -> AWS CLI) als Repository-Secrets hinterlegen."
            exit 1
          fi

      - name: AWS-Credentials aus Learner-Lab-Session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Session noch gueltig?
        run: |
          aws sts get-caller-identity --query Arn --output text || {
            echo "::error title=Learner-Lab-Session abgelaufen::Die temporaeren Zugangsdaten sind ungueltig. Lab neu starten und die 3 GitHub-Secrets aktualisieren (siehe Doku)."
            exit 1
          }

      - name: Bei Amazon ECR anmelden
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image-Tags bestimmen (SemVer aus Git-Tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ needs.build-test.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-test.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unveraenderliche Image-Referenz fuer das Deployment
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${SHORT_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "### Image nach ECR gepusht"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy -> ECS (Fargate)
    needs: [build-test, image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}/actuator/health
    steps:
      - uses: actions/checkout@v4

      - name: AWS-Credentials aus Learner-Lab-Session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Task-Definition aus Vorlage rendern
        env:
          DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CORS_ALLOWED_ORIGINS: ${{ vars.APP_URL }}
          EXECUTION_ROLE_NAME: ${{ vars.EXECUTION_ROLE_NAME || 'LabRole' }}
          TASK_ROLE_NAME: ${{ vars.TASK_ROLE_NAME || 'LabRole' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          for v in DB_SECRET_ARN S3_BUCKET CORS_ALLOWED_ORIGINS; do
            [ -n "${!v}" ] || { echo "::error title=Repository-Variable fehlt::$v ist nicht gesetzt (Settings -> Secrets and variables -> Variables)"; exit 1; }
          done
          export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          export AWS_REGION
          envsubst < .aws/task-definition.json > task-definition.rendered.json
          jq . task-definition.rendered.json > /dev/null

      - name: Neues Image in Task-Definition eintragen
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.rendered.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.image.outputs.image }}

      - name: Rolling Deployment (wartet auf stabilen Service)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke-Test - laeuft die neue Version?
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED: ${{ needs.build-test.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            HEALTH="$(curl -fsS "$APP_URL/actuator/health/readiness" || true)"
            VERSION="$(curl -fsS "$APP_URL/actuator/info" | jq -r '.build.version' || true)"
            echo "Versuch $i: health=$HEALTH version=$VERSION"
            if echo "$HEALTH" | grep -q '"UP"' && [ "$VERSION" = "$EXPECTED" ]; then
              {
                echo "### Deployment verifiziert"
                echo "- Health: \`UP\`"
                echo "- Version auf ECS: \`$VERSION\`"
                echo "- Trips: $(curl -fsS "$APP_URL/v1/trips" | jq length) Eintraege aus RDS"
                echo "- Bilder-Storage: \`$(curl -fsS "$APP_URL/actuator/health" | jq -c '.components.imageStorage')\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Smoke-Test fehlgeschlagen::Erwartete Version $EXPECTED ist nach dem Deployment nicht UP"
          exit 1
